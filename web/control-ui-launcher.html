<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenClaw Control UI 启动器（远程网关）</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 0.5rem; margin-top: 0.25rem; }
    button { margin-top: 1.25rem; padding: 0.6rem 1.2rem; cursor: pointer; }
    .hint { font-size: 0.9rem; color: #444; margin-top: 0.35rem; }
    code { background: #f0f0f0; padding: 0.1rem 0.35rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>OpenClaw Control UI 启动器</h1>
  <p>用于<strong>方案 B</strong>：把官方构建的 <code>dist/control-ui</code> 静态资源托管在任意 HTTPS 域名上，通过查询参数连接<strong>另一台机器上的网关</strong>。</p>

  <label for="uiBase">静态 Control UI 的根地址（你部署的 index.html 所在目录 URL，无末尾 /）</label>
  <input id="uiBase" type="url" placeholder="https://static.example.com/openclaw-ui" autocomplete="off" />
  <p class="hint">例：把 <code>node_modules/openclaw/dist/control-ui</code> 上传到 OSS 后得到的访问域名。</p>

  <label for="gatewayWs">网关 WebSocket 地址</label>
  <input id="gatewayWs" type="text" placeholder="wss://gw.example.com 或 ws://IP:18789" autocomplete="off" />
  <p class="hint">云上请优先 <code>wss://</code>；与官方文档 <code>gatewayUrl</code> 一致，需 URL 编码，由下面按钮自动处理。</p>

  <label for="token">网关 token（可选，建议填；使用 URL fragment，不会发给静态服务器）</label>
  <input id="token" type="password" placeholder="openclaw.json 里 gateway.auth.token" autocomplete="off" />

  <button type="button" id="go">在新标签页打开对话</button>
  <p class="hint">若打不开：检查网关配置里的 <code>gateway.controlUi.allowedOrigins</code> 是否包含上面「静态 UI」的 Origin；并阅读官方 <a href="https://docs.openclaw.ai/web/control-ui">Control UI</a> 文档。</p>

  <script>
    document.getElementById("go").addEventListener("click", function () {
      var base = document.getElementById("uiBase").value.trim().replace(/\/$/, "");
      var gw = document.getElementById("gatewayWs").value.trim();
      var tok = document.getElementById("token").value.trim();
      if (!base || !gw) {
        alert("请填写静态 UI 根地址与网关 WebSocket 地址");
        return;
      }
      var q = "?gatewayUrl=" + encodeURIComponent(gw);
      var url = base + "/" + q;
      if (tok) url += "#token=" + encodeURIComponent(tok);
      window.open(url, "_blank", "noopener,noreferrer");
    });
  </script>
</body>
</html>
