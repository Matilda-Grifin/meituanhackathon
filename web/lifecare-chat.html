<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>本地生活 Agent · 独立对话页</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root { --bg: #0c0f14; --panel: #161b26; --text: #e8edf7; --muted: #8b98ae; --user: #1d4ed8; --bot: #1e293b; --accent: #22c55e; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
    header { padding: 0.75rem 1rem; background: var(--panel); border-bottom: 1px solid #2a3344; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
    header h1 { margin: 0; font-size: 1rem; font-weight: 600; }
    header .tag { font-size: 0.75rem; color: var(--accent); border: 1px solid #166534; padding: 0.15rem 0.45rem; border-radius: 6px; }
    #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .msg { max-width: 92%; padding: 0.65rem 0.85rem; border-radius: 12px; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: var(--user); color: #fff; }
    .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid #334155; }
    .msg.bot :first-child { margin-top: 0; }
    .msg.bot img { max-width: 100%; border-radius: 8px; }
    .msg.bot pre { overflow-x: auto; font-size: 0.8rem; }
    footer { padding: 0.75rem 1rem; background: var(--panel); border-top: 1px solid #2a3344; display: flex; gap: 0.5rem; align-items: flex-end; }
    textarea#in { flex: 1; min-height: 44px; max-height: 120px; resize: vertical; padding: 0.5rem 0.65rem; border-radius: 8px; border: 1px solid #334155; background: #0f1419; color: var(--text); font-size: 0.95rem; }
    button#send { padding: 0.5rem 1rem; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    button#send:disabled { opacity: 0.5; cursor: not-allowed; }
    label.dry { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 0.35rem; white-space: nowrap; }
    .err { color: #f87171; font-size: 0.85rem; padding: 0 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>本地生活 Agent · 独立对话</h1>
    <span class="tag">不经 OpenClaw · 本机 8099</span>
    <label class="dry"><input type="checkbox" id="dry" checked /> dry（不调大模型，需 AMAP_KEY）</label>
  </header>
  <div id="err" class="err"></div>
  <div id="log"></div>
  <footer>
    <textarea id="in" placeholder="例如：下午在杭州带娃逛博物馆…" rows="2"></textarea>
    <button type="button" id="send">发送</button>
  </footer>
  <script>
    var logEl = document.getElementById("log");
    var errEl = document.getElementById("err");
    function add(role, html) {
      var d = document.createElement("div");
      d.className = "msg " + role;
      d.innerHTML = html;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }
    function setErr(t) { errEl.textContent = t || ""; }
    async function send() {
      var text = document.getElementById("in").value.trim();
      if (!text) return;
      setErr("");
      document.getElementById("send").disabled = true;
      add("user", text.replace(/</g, "&lt;"));
      document.getElementById("in").value = "";
      try {
        var r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            dry: document.getElementById("dry").checked,
            max_turns: 8
          })
        });
        var j = await r.json();
        if (!r.ok) throw new Error(j.detail || r.statusText);
        var md = j.reply_markdown || "_空回复_";
        add("bot", marked.parse(md, { breaks: true, gfm: true }));
      } catch (e) {
        setErr(String(e.message || e));
        add("bot", "<p>请求失败。若未勾选 dry，请配置 <code>LLM_API_KEY</code> 后重启 <code>uvicorn web_server_chat:app --port 8099</code>。</p>");
      }
      document.getElementById("send").disabled = false;
    }
    document.getElementById("send").addEventListener("click", send);
    document.getElementById("in").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(); }
    });
    add("bot", "<p>你好。这是<strong>自建对话页</strong>，后端走本仓库 <code>run_local_agent</code>（高德/天气/MCP 同源）。</p><p>默认勾选 <strong>dry</strong>：不耗大模型额度，需本机 <code>.env</code> 里 <code>AMAP_KEY</code>。</p>");
  </script>
</body>
</html>
